# You can name this whatever you want
name: daily

# You will get an error on the automatic updates committing
# if you do not have this line
# You didn't need it before, which is why a lot of yml job files
# you see will not have it (but you need it now!!!)
permissions:
  contents: write
  
# The 'on' section is about when this is run
# workflow_dispatch makes there be a button on GitHub to let you run it manually
# schedule and cron make it run at certain frequencies
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */2 * * *'
jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
    - name: Check out this repo
      uses: actions/checkout@v2
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.14'
    - name: Install all necessary packages
      run: |
        pip install jupyter lxml pandas requests beautifulsoup4 html5lib scikit-learn playwright playwright-stealth
        playwright install --with-deps chromium
    - name: Scraping relevant data lrt_lt
      run: jupyter nbconvert --to notebook --execute "lrt_lt.ipynb" --stdout
    - name: Scraping relevant data lsm_lv
      run: jupyter nbconvert --to notebook --execute "lsm_lv.ipynb" --stdout
    - name: Scraping relevant data err_ee
      run: jupyter nbconvert --to notebook --execute "err_ee.ipynb" --stdout
    - name: Build defence/geopolitics topic map
      run: python topic_analysis.py
    - name: Commit and push any changes
      run: |-
        git config user.name "Automated"
        git config user.email "actions@users.noreply.github.com"
        git add -A
        timestamp=$(date -u)
        git commit -m "Latest data: ${timestamp}" || exit 0
        git push
    # Publish the generated report to the GitHub Pages site (separate repo).
    # Requires a repo secret named PAGES_PUSH_TOKEN: a Personal Access Token
    # with write access to jule4ka/jule4ka.github.io.
    - name: Publish topic map to GitHub Pages
      env:
        PAGES_TOKEN: ${{ secrets.PAGES_PUSH_TOKEN }}
      run: |-
        git clone --depth 1 "https://x-access-token:${PAGES_TOKEN}@github.com/jule4ka/jule4ka.github.io.git" pages_repo
        mkdir -p pages_repo/content
        cp analysis/nordics-monitor.html pages_repo/content/baltics-monitor.html
        cd pages_repo
        git config user.name "Automated"
        git config user.email "actions@users.noreply.github.com"
        git add content/baltics-monitor.html
        git commit -m "Update Nordics/Baltics topic map: $(date -u)" || exit 0
        git push
