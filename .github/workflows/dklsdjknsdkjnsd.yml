# You can name this whatever you want
name: daily

# You will get an error on the automatic updates committing
# if you do not have this line
# You didn't need it before, which is why a lot of yml job files
# you see will not have it (but you need it now!!!)
permissions:
  contents: write
  
# The 'on' section is about when this is run
# workflow_dispatch makes there be a button on GitHub to let you run it manually
# schedule and cron make it run at certain frequencies
on:
  workflow_dispatch:
  schedule:
    # once a day, 05:00 UTC
    - cron: '0 5 * * *'
jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
    - name: Check out this repo
      uses: actions/checkout@v2
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.14'
    - name: Install all necessary packages
      run: |
        pip install jupyter lxml pandas requests beautifulsoup4 html5lib scikit-learn playwright playwright-stealth
        playwright install --with-deps chromium
    - name: Scraping relevant data lrt_lt
      run: jupyter nbconvert --to notebook --execute "lrt_lt.ipynb" --stdout
    - name: Scraping relevant data lsm_lv
      run: jupyter nbconvert --to notebook --execute "lsm_lv.ipynb" --stdout
    - name: Scraping relevant data err_ee
      run: jupyter nbconvert --to notebook --execute "err_ee.ipynb" --stdout
    - name: Build defence/geopolitics topic map
      run: python topic_analysis.py
    - name: Commit and push any changes
      run: |-
        git config user.name "Automated"
        git config user.email "actions@users.noreply.github.com"
        git add -A
        timestamp=$(date -u)
        git commit -m "Latest data: ${timestamp}" || exit 0
        git push
    # Publish the report to the Nikola site (Jule4ka/Jule4ka.github.io), mirroring the
    # working "nordics-monitor" setup. The report is a FULL self-contained HTML document,
    # so it must go under files/ (copied to the site root VERBATIM — no HTML compiler,
    # no theme). A page under pages/ would be run through the compiler, which strips the
    # top-level <style> block and wraps it in the blog theme → unstyled/broken.
    # files/content/baltics_monitor/ -> served at /content/baltics_monitor/ (matches the
    # nav link in conf.py). Then nikola build + github_deploy publishes it.
    # Requires a repo secret PAGES_PUSH_TOKEN: a PAT with write access to that repo.
    - name: Publish report to jule4ka.github.io (Nikola files/ + github_deploy)
      env:
        PAGES_TOKEN: ${{ secrets.PAGES_PUSH_TOKEN }}
      run: |-
        set -e
        git clone -b src "https://x-access-token:${PAGES_TOKEN}@github.com/Jule4ka/Jule4ka.github.io.git" pages_repo
        cd pages_repo
        # Remove the broken page-based attempt + any stray root copy from earlier runs
        git rm --ignore-unmatch jul_site/pages/content/baltics_monitor.html >/dev/null 2>&1 || true
        git rm -r --ignore-unmatch content/baltics_monitor >/dev/null 2>&1 || true
        # Place the FULL standalone report as a static passthrough file (like nordics-monitor)
        mkdir -p jul_site/files/content/baltics_monitor
        cp "$GITHUB_WORKSPACE/analysis/nordics-monitor.html" jul_site/files/content/baltics_monitor/index.html
        # Build + deploy
        pip install "Nikola[extras]"
        git config user.name "Automated"
        git config user.email "actions@users.noreply.github.com"
        cd jul_site
        nikola build
        nikola github_deploy -m "Update Baltics monitor: $(date -u)"
