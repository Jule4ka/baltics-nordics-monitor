# You can name this whatever you want
name: daily

# You will get an error on the automatic updates committing
# if you do not have this line
# You didn't need it before, which is why a lot of yml job files
# you see will not have it (but you need it now!!!)
permissions:
  contents: write
  
# The 'on' section is about when this is run
# workflow_dispatch makes there be a button on GitHub to let you run it manually
# schedule and cron make it run at certain frequencies
on:
  workflow_dispatch:
  schedule:
    # once a day, 05:00 UTC
    - cron: '0 5 * * *'
jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
    - name: Check out this repo
      uses: actions/checkout@v2
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.14'
    - name: Install all necessary packages
      run: |
        pip install jupyter lxml pandas requests beautifulsoup4 html5lib scikit-learn playwright playwright-stealth
        playwright install --with-deps chromium
    - name: Scraping relevant data lrt_lt
      run: jupyter nbconvert --to notebook --execute "lrt_lt.ipynb" --stdout
    - name: Scraping relevant data lsm_lv
      run: jupyter nbconvert --to notebook --execute "lsm_lv.ipynb" --stdout
    - name: Scraping relevant data err_ee
      run: jupyter nbconvert --to notebook --execute "err_ee.ipynb" --stdout
    - name: Build defence/geopolitics topic map
      run: python topic_analysis.py
    - name: Commit and push any changes
      run: |-
        git config user.name "Automated"
        git config user.email "actions@users.noreply.github.com"
        git add -A
        timestamp=$(date -u)
        git commit -m "Latest data: ${timestamp}" || exit 0
        git push
    # Publish the report to the Nikola site (separate repo Jule4ka/Jule4ka.github.io).
    # The report is added as a Nikola PAGE (templated with page.tmpl): the content-only
    # artifact HTML + Nikola metadata, at jul_site/pages/content/baltics_monitor.html.
    # `slug: content/baltics_monitor` puts it at /content/baltics_monitor/. Then
    # `nikola github_deploy` builds the site and deploys it (commits source to `src`,
    # pushes built output to the deploy branch).
    # Requires a repo secret PAGES_PUSH_TOKEN: a PAT with write access to that repo.
    - name: Publish report to jule4ka.github.io (Nikola page + github_deploy)
      env:
        PAGES_TOKEN: ${{ secrets.PAGES_PUSH_TOKEN }}
      run: |-
        set -e
        git clone -b src "https://x-access-token:${PAGES_TOKEN}@github.com/Jule4ka/Jule4ka.github.io.git" pages_repo
        cd pages_repo
        # Drop earlier wrong locations if present (they'd otherwise collide on build)
        git rm -r --ignore-unmatch jul_site/files/content/baltics_monitor content/baltics_monitor >/dev/null 2>&1 || true
        # Write the report as a Nikola page: metadata header + content-only artifact HTML
        mkdir -p jul_site/pages/content
        {
          echo '<!--'
          echo '.. title: Baltic Defence & Geopolitics Monitor'
          echo '.. slug: content/baltics_monitor'
          echo '.. hidetitle: true'
          echo '-->'
          cat "$GITHUB_WORKSPACE/analysis/nordics-monitor-artifact.html"
        } > jul_site/pages/content/baltics_monitor.html
        # Build + deploy
        pip install "Nikola[extras]"
        git config user.name "Automated"
        git config user.email "actions@users.noreply.github.com"
        cd jul_site
        nikola build
        nikola github_deploy -m "Update Baltics monitor: $(date -u)"
