# You can name this whatever you want
name: daily

# You will get an error on the automatic updates committing
# if you do not have this line
# You didn't need it before, which is why a lot of yml job files
# you see will not have it (but you need it now!!!)
permissions:
  contents: write
  
# The 'on' section is about when this is run
# workflow_dispatch makes there be a button on GitHub to let you run it manually
# schedule and cron make it run at certain frequencies
on:
  workflow_dispatch:
  schedule:
    # once a day, 05:00 UTC
    - cron: '0 5 * * *'
jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
    - name: Check out this repo
      uses: actions/checkout@v2
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.14'
    - name: Install all necessary packages
      run: |
        pip install jupyter lxml pandas requests beautifulsoup4 html5lib scikit-learn playwright playwright-stealth
        playwright install --with-deps chromium
    - name: Scraping relevant data lrt_lt
      run: jupyter nbconvert --to notebook --execute "lrt_lt.ipynb" --stdout
    - name: Scraping relevant data lsm_lv
      run: jupyter nbconvert --to notebook --execute "lsm_lv.ipynb" --stdout
    - name: Scraping relevant data err_ee
      run: jupyter nbconvert --to notebook --execute "err_ee.ipynb" --stdout
    - name: Build defence/geopolitics topic map
      run: python topic_analysis.py
    - name: Commit and push any changes
      run: |-
        git config user.name "Automated"
        git config user.email "actions@users.noreply.github.com"
        git add -A
        timestamp=$(date -u)
        git commit -m "Latest data: ${timestamp}" || exit 0
        git push
    # Publish the report to the Nikola site (separate repo Jule4ka/Jule4ka.github.io).
    # GitHub Pages serves the `src` branch, whose ROOT holds the built site (with a
    # .nojekyll), and whose jul_site/ holds the Nikola source. Our page is a
    # self-contained static file, and Nikola copies files/ to the site root verbatim,
    # so we commit the SAME file to `src` in two places — no Nikola build needed:
    #   - jul_site/files/content/baltics_monitor/index.html  (source; survives rebuilds)
    #   - content/baltics_monitor/index.html                 (served root; live immediately)
    # Requires a repo secret PAGES_PUSH_TOKEN: a PAT with write access to that repo.
    - name: Publish report to jule4ka.github.io (src branch)
      env:
        PAGES_TOKEN: ${{ secrets.PAGES_PUSH_TOKEN }}
      run: |-
        set -e
        git clone -b src --depth 1 "https://x-access-token:${PAGES_TOKEN}@github.com/Jule4ka/Jule4ka.github.io.git" pages_repo
        mkdir -p pages_repo/jul_site/files/content/baltics_monitor pages_repo/content/baltics_monitor
        cp analysis/nordics-monitor.html pages_repo/jul_site/files/content/baltics_monitor/index.html
        cp analysis/nordics-monitor.html pages_repo/content/baltics_monitor/index.html
        cd pages_repo
        git config user.name "Automated"
        git config user.email "actions@users.noreply.github.com"
        git add jul_site/files/content/baltics_monitor/index.html content/baltics_monitor/index.html
        git commit -m "Update Baltics monitor: $(date -u)" || exit 0
        git push
