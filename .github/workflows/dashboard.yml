name: dashboard

# Rebuild and publish the report once a day from whatever data the scrape job
# (scrape.yml) has committed. This job does NOT scrape.
permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    # once a day, 05:30 UTC (offset from the scrape cron so they don't collide)
    - cron: '30 5 * * *'

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
    - name: Check out this repo
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'
    - name: Install analysis packages (core — must succeed)
      run: pip install lxml pandas requests beautifulsoup4 html5lib scikit-learn
    - name: Install embedding extras (optional — page degrades gracefully if this fails)
      # fastembed + umap-learn power the semantic-embeddings sections of the page.
      # The committed analysis/emb_cache keeps this cheap: only NEW articles are
      # embedded each run. continue-on-error so a wheel gap (e.g. numba lagging a new
      # Python) can't sink the daily publish — render.py then builds a TF-IDF-only page.
      continue-on-error: true
      run: pip install fastembed umap-learn
    - name: Build defence/geopolitics topic map from the latest committed data
      run: python topic_analysis.py
    - name: Commit and push the rebuilt dashboard
      run: |-
        git config user.name "Automated"
        git config user.email "actions@users.noreply.github.com"
        git add -A
        git commit -m "Dashboard update: $(date -u)" || exit 0
        # A scrape may have pushed while we were building.
        git pull --rebase --autostash origin main || true
        git push
    # Publish the report to the Nikola site (Jule4ka/Jule4ka.github.io). The report is a
    # FULL self-contained HTML document, so it goes under files/ (copied to the site root
    # VERBATIM — no compiler, no theme). At files/content/baltics_monitor/ it serves at
    # /content/baltics_monitor/ as a stand-alone FULL-SCREEN page (matching the nav link
    # in conf.py). Then nikola build + github_deploy publishes it.
    # Requires a repo secret PAGES_PUSH_TOKEN: a PAT with write access to that repo.
    - name: Publish report to jule4ka.github.io (files/ + github_deploy)
      env:
        PAGES_TOKEN: ${{ secrets.PAGES_PUSH_TOKEN }}
      run: |-
        set -e
        git clone -b src "https://x-access-token:${PAGES_TOKEN}@github.com/Jule4ka/Jule4ka.github.io.git" pages_repo
        cd pages_repo
        # Remove earlier attempts (the pages/ iframe page + any stray placements)
        git rm --ignore-unmatch jul_site/pages/content/baltics_monitor.html >/dev/null 2>&1 || true
        git rm -r --ignore-unmatch jul_site/files/baltics-monitor content/baltics_monitor >/dev/null 2>&1 || true
        # Place the FULL standalone report as a verbatim static file -> full-screen page
        mkdir -p jul_site/files/content/baltics_monitor
        cp "$GITHUB_WORKSPACE/analysis/baltics-monitor.html" jul_site/files/content/baltics_monitor/index.html
        # Build + deploy
        pip install "Nikola[extras]"
        git config user.name "Automated"
        git config user.email "actions@users.noreply.github.com"
        cd jul_site
        nikola build
        nikola github_deploy -m "Update Baltics monitor: $(date -u)"
